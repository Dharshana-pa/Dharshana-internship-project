<!DOCTYPE html>
<html>
<head>
    <title>Resume Screening System</title>
</head>

<body>

<h1>Resume Screening System</h1>

<h2>Match Percentage</h2>
<p>{{ percentage }}%</p>

<h2>Matched Skills</h2>
<ul>
{% for skill in matched %}
    <li>{{ skill }}</li>
{% endfor %}
</ul>

<h2>Missing Skills</h2>
<ul>
{% for skill in missing %}
    <li>{{ skill }}</li>
{% endfor %}
</ul>

</body>
</html>
